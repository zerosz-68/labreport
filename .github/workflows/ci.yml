name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 命令冒烟
        shell: bash
        run: |
          labreport --version
          labreport card list
          labreport doctor || true   # 缺可选程序时返回 3，不算失败

      - name: 回归测试（不含需要真实 .docx 的用例）
        run: python tests/run_all.py

      - name: 零安装入口也要能用
        shell: bash
        run: python run.py card list
