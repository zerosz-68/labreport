name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # 让 Python 的 stdio 一律走 UTF-8：Windows runner 默认是 cp1252，
      # 打印中文会 UnicodeEncodeError（CLI 侧也已做了容错，这里是双保险）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 必须先装依赖：回归测试会真的调用 CLI，缺 python-docx/lxml/Pillow 时
      # doctor 会正确报"缺核心依赖"并返回 1（第一次跑红就是这个原因，不是代码问题）。
      - name: 安装（含核心依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 回归测试（不需要真实 .docx）
        run: python tests/run_all.py

      - name: 零安装入口也要能用
        run: python run.py card list

      - name: 安装后的命令冒烟
        shell: bash
        run: |
          labreport --version
          labreport card list
          labreport doctor || true   # 缺可选程序时返回 3，不算失败
