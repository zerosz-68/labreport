name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 先跑测试（测试自带 sys.path 引导，不依赖安装），
      # 这样"打包/安装"的问题不会掩盖"功能"的问题，反之亦然。
      - name: 回归测试（不需要真实 .docx）
        run: python tests/run_all.py

      - name: 零安装入口也要能用
        run: python run.py card list

      - name: 安装为包
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 安装后的命令冒烟
        shell: bash
        run: |
          labreport --version
          labreport card list
          labreport doctor || true   # 缺可选程序时返回 3，不算失败
